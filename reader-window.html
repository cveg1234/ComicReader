<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="styles/reader.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; }
.reader-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 3000; flex-direction: column; }
.reader-overlay.active { display: flex !important; }
.reader-overlay.show-header .reader-header { transform: translateY(0) !important; }
.reader-overlay.show-header .reader-footer { transform: translateY(0) !important; }
#open-new-window { display: none; }
.reader-container { padding: 0 !important; }
.reader-overlay.show-header .reader-container { padding-top: 60px !important; padding-bottom: 50px !important; }
.reader-page { max-height: 100vh !important; }
.reader-container.mode-single { overflow: hidden !important; }
.reader-container.mode-single .reader-page { width: 100% !important; height: 100% !important; max-width: 100% !important; max-height: 100% !important; object-fit: contain; }
</style>
</head>
<body>
<div class="reader-overlay" id="reader-overlay">
  <div class="reader-header" id="reader-header">
    <button class="reader-back-btn" id="reader-close" data-reader-action="close">
      <span>←</span>
      <span>Back</span>
    </button>
    <div class="reader-info">
      <h3 id="reader-title"></h3>
      <span id="reader-chapter"></span>
    </div>
    <div class="reader-controls">
      <button class="reader-btn" id="prev-chapter" data-reader-action="prev" title="Previous Page">◀</button>
      <button class="reader-btn" id="next-chapter" data-reader-action="next" title="Next Page">▶</button>
      <button class="reader-btn" id="reader-settings-btn" data-reader-action="settings" title="Settings">⚙️</button>
      <select id="chapter-select" class="chapter-select"></select>
    </div>
  </div>
  <div class="reader-container" id="reader-container"></div>
  <div class="reader-footer" id="reader-footer">
    <span id="page-indicator">Page 1 / 1</span>
    <div class="reader-progress">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
  </div>
</div>
<script src="js/logger.js"></script>
<script>
window.app = {
  settings: {
    readingMode: 'single',
    readerBg: 'black',
    fitScreen: 'height',
    pageGap: 4
  },
  localComics: [],
  library: [],
  isReturningFromReader: false,
  showToast: () => {},
  saveData: () => {},
  renderLibrary: () => {},
  addToHistory: (comic, page, totalPages) => {
    window.electronAPI.loadData('history').then(existing => {
      let history = Array.isArray(existing) ? existing : [];
      const idx = history.findIndex(h => h.comicId === comic.id);
      if (idx >= 0) history.splice(idx, 1);
      history.unshift({
        comicId: comic.id,
        name: comic.name,
        type: comic.type || 'folder',
        page,
        totalPages,
        time: new Date().toLocaleString()
      });
      if (history.length > 100) history.pop();
      window.electronAPI.saveData('history', history);
    }).catch(() => {});
  }
};
window.logger = window.logger || { info: () => {}, warn: () => {}, error: () => {} };
</script>
<script src="js/reader.js"></script>
<script src="js/reader-window.js"></script>
</body>
</html>
